<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glass Launcher</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="phone">
    <header>
      <span>9:41</span>
      <button id="notifyBtn">🔔</button>
    </header>

    <section class="home">
      <h1>Good Morning 👋</h1>
      <p>Glass Launcher</p>

      <div class="apps">
        <button class="app">📞<small>Phone</small></button>
        <button class="app">💬<small>Messages</small></button>
        <button class="app">📷<small>Camera</small></button>
        <button class="app">🌐<small>Browser</small></button>
        <button class="app">🎵<small>Music</small></button>
        <button class="app">⚙️<small>Settings</small></button>
      </div>
    </section>

    <aside id="panel" class="notification-panel">
      <div class="panel-head">
        <h2>Notifications</h2>
        <button id="closeBtn">✕</button>
      </div>

      <div class="notification">
        <b>Welcome!</b>
        <p>Aapka Glass Launcher ready hai.</p>
      </div>

      <div class="notification">
        <b>Tip</b>
        <p>Apps par click karke future features add karein.</p>
      </div>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
